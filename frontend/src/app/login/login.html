<div class="login-page">
  <mat-card appearance="outlined" class="login-card">
    <form (ngSubmit)="submit()">
      <h1>{{ 'login.title' | translate }}</h1>
      <p class="subtitle">{{ 'login.subtitle' | translate }}</p>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.username' | translate }}</mat-label>
        <input matInput type="text" name="username" [(ngModel)]="username" autocomplete="username" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'login.password' | translate }}</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
      </mat-form-field>

      @if (errorKey()) {
        <p class="error">{{ errorKey() | translate }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="loading()">
        {{ (loading() ? 'login.submitting' : 'login.submit') | translate }}
      </button>
    </form>
  </mat-card>
</div>
