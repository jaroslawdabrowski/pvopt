<div class="login-page">
  <form class="card login-card" (ngSubmit)="submit()">
    <div class="login-head">
      <span class="login-mark" aria-hidden="true"><span class="material-symbols-rounded">bolt</span></span>
      <h1 class="page-title">{{ 'login.title' | translate }}</h1>
      <p class="page-lead">{{ 'login.subtitle' | translate }}</p>
    </div>

    <div class="field">
      <label for="login-username">{{ 'login.username' | translate }}</label>
      <input id="login-username" class="input" type="text" name="username" [(ngModel)]="username" autocomplete="username" required />
    </div>

    <div class="field">
      <label for="login-password">{{ 'login.password' | translate }}</label>
      <input id="login-password" class="input" type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
    </div>

    @if (errorKey()) {
      <p class="error-box appear" role="alert">
        <span class="material-symbols-rounded" aria-hidden="true">error</span>
        <span>{{ errorKey() | translate }}</span>
      </p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="loading()">
      {{ (loading() ? 'login.submitting' : 'login.submit') | translate }}
    </button>
  </form>
</div>
