@if (authService.isAuthenticated()) {
  <div class="shell">
    <!-- Desktop: fixed sidebar -->
    <aside class="sidebar">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-mark" aria-hidden="true"><span class="material-symbols-rounded">bolt</span></span>
        <span class="brand-name">PV Opt</span>
      </a>

      <nav class="side-nav" [attr.aria-label]="'nav.label' | translate">
        @for (item of navItems; track item.path) {
          <a class="side-link" [routerLink]="item.path" routerLinkActive="active">
            <span class="material-symbols-rounded" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.labelKey | translate }}</span>
          </a>
        }
      </nav>

      <div class="side-bottom">
        <app-language-switcher />
        <button class="side-link logout" type="button" (click)="logout()">
          <span class="material-symbols-rounded" aria-hidden="true">logout</span>
          <span>{{ 'nav.logout' | translate }}</span>
        </button>
      </div>
    </aside>

    <!-- Phone: slim top bar -->
    <header class="topbar">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-mark" aria-hidden="true"><span class="material-symbols-rounded">bolt</span></span>
        <span class="brand-name">PV Opt</span>
      </a>
      <div class="topbar-end">
        <app-language-switcher />
        <button class="icon-btn" type="button" (click)="logout()" [attr.aria-label]="'nav.logout' | translate">
          <span class="material-symbols-rounded">logout</span>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <!-- Phone: floating bottom tab bar -->
    <nav class="tabbar" [attr.aria-label]="'nav.label' | translate">
      @for (item of navItems; track item.path) {
        <a class="tab" [routerLink]="item.path" routerLinkActive="active">
          <span class="material-symbols-rounded" aria-hidden="true">{{ item.icon }}</span>
          <span class="tab-label">{{ item.shortKey | translate }}</span>
        </a>
      }
    </nav>
  </div>
} @else {
  <router-outlet />
}
