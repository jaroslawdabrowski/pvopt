# --- Frontend (Angular in ../frontend, built and served by Quinoa) ---
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=dist/frontend/browser
# Use the system Node/npm (must satisfy the Angular CLI's requirements - see frontend/package.json).
quarkus.quinoa.package-manager-install=false
# Serve index.html for unknown non-API paths (e.g. a hard refresh on /dashboard) so
# Angular's router - not Quarkus - handles client-side routes.
quarkus.quinoa.enable-spa-routing=true

# --- Database (SQLite, file-based - one process, no separate DB server) ---
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/pvopt.db
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# --- Decision engine (SOC thresholds, consumption, G12 tariff windows) ---
pvopt.planning.min-soc-percent=20
pvopt.planning.full-soc-percent=100
# Average daily consumption ~16kWh (heavier during the day) - used by the overnight decision.
pvopt.planning.daily-consumption-estimate-kwh=16.0
# TODO: tune to actual afternoon/evening (13:00-24:00) usage once observed.
pvopt.planning.afternoon-consumption-estimate-kwh=8.0
pvopt.planning.forecast-safety-margin-ratio=1.2
pvopt.planning.cheap-tariff-windows=22:00-06:00,13:00-15:00

# --- PV production forecast (Forecast.Solar - install location/parameters) ---
# Two planes: 3kWp east-facing + 5kWp west-facing, both 30 degrees tilt (8kWp total).
# TODO: fill in the real lat/lon coordinates (currently a Warsaw-ish placeholder).
pvopt.forecast.latitude=52.2297
pvopt.forecast.longitude=21.0122
pvopt.forecast.east.declination=30
pvopt.forecast.east.azimuth=-90
pvopt.forecast.east.kwp=3.0
pvopt.forecast.west.declination=30
pvopt.forecast.west.azimuth=90
pvopt.forecast.west.kwp=5.0
quarkus.rest-client.forecast-solar.url=https://api.forecast.solar

# --- Deye inverter / Solarman logger (local Modbus) ---
# host and logger-serial are real, personal data (reveal LAN topology + device serial) -
# they are NOT set here. Put them in a git-ignored `.env` file at the backend/ project
# root (Quarkus loads it automatically in dev mode) as:
#   PVOPT_INVERTER_SOLARMAN_HOST=...
#   PVOPT_INVERTER_SOLARMAN_LOGGER_SERIAL=...
# The connection (host/port/serial), the battery SOC register (588), and the TOU slot
# register bases (time/batt-target/grid-charge-enable) below are all CONFIRMED WORKING
# against real hardware. The TOU slot *times* themselves still need the one-off
# TouSlotSetupManualTest run before they match the G12 boundaries this app assumes
# (see TouSlots.java) - until then, don't flip write-enabled to true.
pvopt.inverter.solarman.host=192.168.1.100
pvopt.inverter.solarman.port=8899
pvopt.inverter.solarman.logger-serial=0
pvopt.inverter.solarman.tou-time-base-register=148
pvopt.inverter.solarman.tou-batt-target-base-register=166
pvopt.inverter.solarman.tou-grid-charge-enable-base-register=172
# SAFETY: keep false until the TOU slot times have been rewritten (TouSlotSetupManualTest)
# and you're deliberately ready to let the scheduler write unattended, twice a day. With
# this false, applyChargeSchedule only logs what it would have written.
pvopt.inverter.solarman.write-enabled=false

# --- Basic Auth (one shared user, LAN-only) ---
# The default password below is "changeme" (hash verified with BcryptUtil.matches).
# BEFORE running outside localhost: generate your own hash, e.g. from a test/main class:
#   io.quarkus.elytron.security.common.BcryptUtil.bcryptHash("your-password")
pvopt.security.username=admin
pvopt.security.password-hash=$2a$10$iTVbCZlTJH10ae6TGXm0.uvpu6ODBYfnQ4yjXd8Syg1oxMr/stv9.
quarkus.http.auth.basic=true
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
